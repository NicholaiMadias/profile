name: Endpoint toolkit tests

on:
  push:
    paths:
      - "enterprise-endpoint-toolkit/**"
      - "examples/phi-redaction-proxy/**"
      - ".github/workflows/endpoint-toolkit-tests.yml"
      - "app/**"
      - "backend/**"
      - "public/Apps/pushToGitHUB.js"
      - "tests/security-boundaries.test.mjs"
      - "package*.json"
  pull_request:
    paths:
      - "enterprise-endpoint-toolkit/**"
      - "examples/phi-redaction-proxy/**"
      - "backend/**"
      - "public/Apps/pushToGitHUB.js"
      - "tests/security-boundaries.test.mjs"
      - ".github/workflows/endpoint-toolkit-tests.yml"

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check backend syntax and authorization contracts
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend/tests -v

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install requests
      - name: Run Graph client unit tests
        env:
          PYTHONPATH: enterprise-endpoint-toolkit/python
        run: python -m unittest discover -s enterprise-endpoint-toolkit/python/tests -v
      - name: Run PHI redaction proxy synthetic tests
        run: python -m unittest discover -s examples/phi-redaction-proxy -p 'test_*.py' -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run PowerShell unit tests
        shell: pwsh
        run: Invoke-Pester -Path enterprise-endpoint-toolkit/tests -CI
      - name: Parse PowerShell modules
        shell: pwsh
        run: |
          $errorsFound = @()
          Get-ChildItem enterprise-endpoint-toolkit/modules -Recurse -Filter *.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errorsFound += $parseErrors
          }
          if ($errorsFound.Count -gt 0) { $errorsFound | Out-String | Write-Error; exit 1 }

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip install -e enterprise-endpoint-toolkit/python
      - run: python -m pip_audit
      - name: Audit LMS backend pinned Python dependencies
        run: python -m pip_audit -r backend/requirements.txt
