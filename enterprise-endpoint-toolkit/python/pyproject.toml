[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-endpoint-toolkit"
version = "0.1.0"
description = "Endpoint reporting and Graph API examples"
requires-python = ">=3.10"
dependencies = ["pandas>=2", "plotly>=5", "requests>=2.31"]
[tool.setuptools.packages.find]
where = ["."]
