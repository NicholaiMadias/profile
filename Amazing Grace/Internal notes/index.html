<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Star Matrix | Amazing Grace</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
        /* Initial Loader Aesthetic */
        .loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(139, 92, 246, 0.1);
            border-left-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status-text {
            margin-top: 1rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #8b5cf6;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen" id="loader">
            <div class="spinner"></div>
            <div class="status-text">Initializing The Star Matrix...</div>
        </div>
    </div>

    <!-- Firebase Configuration Injection Point -->
    <script>
        // This constant is injected by the CI/CD pipeline
        const __firebase_config = __firebase_config;
        const __app_id = 'matrix-act-1';
    </script>

    <!-- React and Dependencies (CDN for prototype simplicity) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Application Logic -->
    <script type="text/babel" src="StoryEngineSynthesis.jsx"></script>

    <script type="text/babel">
        // Hide loader once app is mounted
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            if (loader) {
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }, 1000);
            }
        });
    </script>
</body>
</html>
