version: "1.0"

governance:
  voting:
    enabled: true
    voting_window_seconds: 120
    approval_score_required: 2
    participants:
      user:
        weight: 4
        can_override: true
      Guardian:
        weight: 1
      Electra:
        weight: 1
      Ella:
        weight: 1
    auto_execute_on_approval: true
    actions_on_approval:
      - commit
      - push
      - deploy
      - summarize
    actions_on_rejection:
      - close_request
      - summarize

personas:
  guardian:
    role: "System Gatekeeper & Security Enforcer"
  electra:
    role: "PR Reviewer & Quality Assessor"
  ella:
    role: "Automated Suggestion & Patch Applicator"
